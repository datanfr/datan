# Les variables suivantes doivent être configurées dans les Secrets du repo GitHub :
# CPANEL_USERNAME  : Nom d’utilisateur cPanel pour l’authentification.
# CPANEL_PASSWORD  : Mot de passe cPanel (ou token) qui doit être encodé URL
# CPANEL_SERVER    : Adresse du serveur cPanel (exemple : monserveur.o2switch.net).
# SSH_PRIVATE_KEY : Clé privée SSH pour l’authentification.

name: Deploy to Production

on:
  push:
    branches: [master]
  repository_dispatch:
    types: [submodule_updated]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # API du plugin o2switch "SSH whitelist" de cPanel (les secrets sont masqués dans les logs)
      CPANEL_API: https://${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_PASSWORD }}@${{ secrets.CPANEL_SERVER }}:2083/frontend/o2switch/o2switch-ssh-whitelist/index.live.php
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Update scripts submodule to latest master
        run: |
          cd scripts
          git checkout master
          git pull origin master
          cd ..
          echo "Scripts submodule is now at commit: $(git -C scripts rev-parse HEAD)"

      - name: Get the public IP of the GitHub runner
        id: ip
        run: |
          IP=$(curl -4 -sf --max-time 10 https://api.ipify.org || curl -4 -sf --max-time 10 https://checkip.amazonaws.com)
          IP=$(echo "$IP" | tr -d "[:space:]")
          if [[ ! "$IP" =~ ^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "Impossible de déterminer l'IP publique du runner : '$IP'"
            exit 1
          fi
          echo "Runner public IP: $IP"
          echo "ipv4=$IP" >> "$GITHUB_OUTPUT"

      - name: List all whitelisted IPs
        id: list-ips
        run: |
          # --retry ne rejoue que les erreurs transitoires (connexion, 5xx), pas un 401/403.
          # Le corps est écrit dans un fichier (et non sur stdout) car curl le tronque à chaque nouvelle tentative.
          BODY_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS --max-time 30 --retry 3 --retry-delay 5 -o "$BODY_FILE" -w '%{http_code}' "$CPANEL_API?r=list")
          RAW=$(cat "$BODY_FILE")

          # On ne garde que ce qui commence à la première ligne débutant par "{" (ignore une éventuelle notice PHP)
          JSON_OUTPUT=$(echo "$RAW" | sed -n '/^[[:space:]]*{/,$p')

          if [[ "$HTTP_CODE" != "200" ]] || ! echo "$JSON_OUTPUT" | jq -e '.data.list | type == "array"' >/dev/null 2>&1; then
            echo "::error::L'API whitelist cPanel n'a pas renvoyé la liste attendue (HTTP $HTTP_CODE). Vérifier les secrets CPANEL_USERNAME / CPANEL_PASSWORD (encodé URL) / CPANEL_SERVER et l'accès au cPanel."
            echo "Réponse brute (40 premières lignes) :"
            echo "$RAW" | head -n 40
            exit 1
          fi

          if [[ "$JSON_OUTPUT" != "$RAW" ]]; then
            echo "::warning::Du texte inattendu précède le JSON renvoyé par cPanel :"
            echo "$RAW" | sed '/^[[:space:]]*{/,$d' | head -n 10
          fi

          echo "Whitelisted IPs (JSON):"
          echo "$JSON_OUTPUT" | jq .

          IPS=$(echo "$JSON_OUTPUT" | jq -r '.data.list[].address' | sort -u | paste -sd "," -)
          echo "ips=$IPS" >> "$GITHUB_OUTPUT"

      #Les adresses IP à conserver dans la liste blanche du serveur sont à définir dans KEEP_IPS
      - name: Remove unneeded whitelisted IPs
        env:
          RUNNER_IP: ${{ steps.ip.outputs.ipv4 }}
          WHITELISTED_IPS: ${{ steps.list-ips.outputs.ips }}
        run: |
          KEEP_IPS="109.137.71.77 92.184.106.90 $RUNNER_IP"

          for ip in $(echo "$WHITELISTED_IPS" | tr ',' ' '); do
            if [[ ! " $KEEP_IPS " =~ " $ip " ]]; then
              echo "Removing IP: $ip"
              curl -sS --max-time 30 "$CPANEL_API?r=remove&address=$ip&direction=in&port=22"; echo
              curl -sS --max-time 30 "$CPANEL_API?r=remove&address=$ip&direction=out&port=22"; echo
            else
              echo "Keeping IP: $ip"
            fi
          done

      - name: Add runner IP to whitelist
        run: |
          curl -sS --max-time 30 -X POST \
            -d "whitelist[address]=${{ steps.ip.outputs.ipv4 }}" \
            -d "whitelist[port]=22" \
            "$CPANEL_API?r=add"; echo

      - name: Verify whitelist contains runner IP
        run: |
          LIST=$(curl -sS --max-time 30 "$CPANEL_API?r=list")
          if ! echo "$LIST" | grep -q "${{ steps.ip.outputs.ipv4 }}"; then
            echo "::error::L'IP du runner ${{ steps.ip.outputs.ipv4 }} n'apparaît pas dans la whitelist cPanel."
            echo "$LIST" | head -n 40
            exit 1
          fi
          echo "Runner IP ${{ steps.ip.outputs.ipv4 }} is whitelisted."

      - name: Installing the SSH Key
        run: |
          eval $(ssh-agent -s)
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 0400 ~/.ssh/id_rsa

      - name: Sending data with RSYNC
        run: |
          BACKUP_DIR=../backup_datan/$(date +%Y%m)
          rsync --timeout=300 -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            --exclude='*/config/development' \
            --exclude='*/logs/log-*.php' \
            --exclude='*/cache/*' \
            --exclude='user_guide_src/build/*' \
            --exclude='user_guide_src/cilexer/build/*' \
            --exclude='user_guide_src/cilexer/dist/*' \
            --exclude='user_guide_src/cilexer/pycilexer.egg-info/*' \
            --exclude='application/logs/*' \
            --exclude='/vendor/' \
            --exclude='application/config/custom_config.php' \
            --exclude='node_modules' \
            --exclude='test' \
            --exclude='.sass-cache' \
            --exclude='package-lock.json' \
            --exclude='.gitattributes' \
            --exclude='ressources' \
            --exclude='.htaccess' \
            --exclude='.env' \
            --exclude='*.code-workspace' \
            --exclude='assets/opendata' \
            --exclude='assets/dataset_backup/general/*.sql' \
            --exclude='assets/imgs/deputes_original/' \
            --exclude='assets/imgs/deputes_ogp/' \
            --exclude='assets/imgs/deputes_webp/' \
            --exclude='assets/imgs/deputes_nobg/' \
            --exclude='assets/imgs/deputes_nobg_import/' \
            --exclude='assets/imgs/deputes_nobg_webp/' \
            --exclude='assets/imgs/posts/' \
            --exclude='assets/imgs/captcha/*.jpg' \
            --exclude='assets/data/*.json' \
            --exclude='assets/data/professions/election_4/*.pdf' \
            --exclude='assets/data/professions/election_6/*.pdf' \
            --exclude='assets/data/*.txt' \
            --exclude='assets/css/bootstrap*' \
            -av --backup --backup-dir=$BACKUP_DIR --delete ./ ${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_SERVER }}:public_html
      
      - name: Clear cache on datan.fr
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            ${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_SERVER }} \
            "php /home/${{ secrets.CPANEL_USERNAME }}/public_html/index.php cache clear_cli"

      - name: Cleaning SSH keys
        if: always()
        run: rm -fr ~/.ssh
