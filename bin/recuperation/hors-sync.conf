table tag
table amendement_tag
cle amendement_tag amendement_id amendement amendement_id
table lot_ia
table lot_ia_element
cle lot_ia_element amendement_id amendement amendement_id

# --- Posé hors sync sur des lignes du sync -----------------------------------
# Amendements des législatures closes : aucun dépôt moissonné ne les porte.
lignes amendement amendement_id legislature < 17
# Votes MODEM de la 15e, perdus par l'open data (app:import:votes et
# vote-groupes) : sept scrutins, repris en entier — l'upsert réécrit à
# l'identique ce que l'import des dépôts figés a posé.
lignes vote depute_id=depute.mp_id,scrutin_id=scrutin.uid,vote_type t.scrutin_id IN (SELECT id FROM scrutin WHERE uid IN ('VTANR5L15V2418', 'VTANR5L15V2744', 'VTANR5L15V2751', 'VTANR5L15V2752', 'VTANR5L15V2761', 'VTANR5L15V2762', 'VTANR5L15V2766'))
lignes vote_groupe scrutin_id=scrutin.uid,groupe_id=groupe.uid t.scrutin_id IN (SELECT id FROM scrutin WHERE uid IN ('VTANR5L15V2418', 'VTANR5L15V2744', 'VTANR5L15V2751', 'VTANR5L15V2752', 'VTANR5L15V2761', 'VTANR5L15V2762', 'VTANR5L15V2766'))
# Résumés IA et relecture de la rédaction.
colonnes amendement amendement_id resume_ia titre_ia resume_relu simplicite_ia justification_ia categorie_ia
# Rattachements des scrutins : arbitrages, scraping de rattrapage, législatures closes.
colonnes scrutin uid dossier_id=dossier.dossier_id amendement_id=amendement.amendement_id
