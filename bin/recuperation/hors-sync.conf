# Ce que `app:sync:quotidien --tout` ne remplit pas, et que
# bin/recuperation/exporter-hors-sync.sh exporte donc de la base du port.
#
# But : base vide + migrations + sync --tout (+ les commandes régénérables de
# DEPLOIEMENT.md) + cet export = base équivalente à la production.
#
# Quatre directives, une par ligne :
#
#   table T
#       Table entière, identifiants compris, toutes colonnes (une colonne
#       ajoutée par migration suit d'elle-même). Réservé aux tables que le sync
#       n'écrit jamais : leurs identifiants n'entrent en collision avec rien.
#
#   cle T COLONNE TABLE_DU_SYNC CLE_NATURELLE
#       Dans une table exportée par `table`, une colonne qui pointe une table
#       du sync. Ses identifiants ne survivent pas à une reconstruction (le
#       sync les attribue dans l'ordre où il lit les fichiers) : la colonne est
#       retraduite par la clé naturelle (uid du scrutin, mp_id du député).
#
#   colonnes T CLE_NATURELLE COL [COL=TABLE.CLE …]
#       Colonnes posées hors du sync sur des lignes que le sync crée : réécrites
#       par UPDATE … WHERE CLE_NATURELLE = …. `COL=TABLE.CLE` désigne une
#       colonne qui pointe une autre table du sync, retraduite de même. Une
#       colonne absente de la base est ignorée (elle peut appartenir à une
#       migration pas encore jouée).
#
#   lignes T CLES CONDITION
#       Lignes entières d'une table du sync que le sync ne produit pas,
#       réinsérées sans leur identifiant (INSERT … SELECT … ON DUPLICATE KEY
#       UPDATE). CLES, séparées par des virgules, sont les colonnes de la clé
#       unique, que l'UPDATE ne réécrit pas ; `COL=TABLE.CLE` y retraduit une
#       colonne qui pointe une table du sync. Une ligne dont la cible manque à
#       la base n'est pas insérée (et pas d'erreur). La condition est du SQL,
#       jusqu'à la fin de la ligne, sur la table aliasée `t`.
#
# Point d'extension : une table de plus, une ligne de plus ici.

